[project]
name = "telegram-account-switcher"
version = "2.0.0"
description = "Telegram Account Switcher Project!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contextvars>=2.4",
    "cryptography>=47.0.0",
    "loguru>=0.7.3",
    "psutil>=7.2.1",
    "pyside6>=6.11.0",
    "tgcrypto>=1.2.5",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
build = [
    "nuitka==4.0.8",
    "zstandard>=0.25.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyfakefs>=6.2.0",
]
