name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_ARCH: 'x64'
  OS_ENV: 'Windows_x64'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        compiler: [mingw, msvc]
    outputs:
      version: ${{ steps.generate-output.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ env.BUILD_ARCH }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: false

      - name: Install Dependencies
        run: |
          uv sync --no-dev

      - name: Download and setup UPX v5.1.0
        shell: pwsh
        run: |
          $UPX_URL = "https://github.com/upx/upx/releases/download/v5.1.0/upx-5.1.0-win64.zip"
          $UPX_ZIP = "upx-5.1.0-win64.zip"
          $UPX_DIR = "upx-5.1.0-win64"
          Invoke-WebRequest -Uri $UPX_URL -OutFile $UPX_ZIP
          Expand-Archive -Path $UPX_ZIP -DestinationPath . -Force
          $UPX_FULL_PATH = (Get-Item ".\$UPX_DIR").FullName
          echo "$UPX_FULL_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Nuitka
        run: |
          uv pip install 'nuitka[onefile]'

      - name: Generate Output Name
        id: generate-output
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $PY_VER = uv run python -c "import sys;print(sys.version.split(' ')[0])"
          $VERSION = uv run python -c "from src.main import VERSION;print(VERSION)"
          
          # 依据编译器区分后缀
          $COMPILER_SUFFIX = if ("${{ matrix.compiler }}" -eq "mingw") { "MinGW" } else { "MSVC" }
          $OUTPUT_NAME = "TAS_v${VERSION}_$($env:OS_ENV)_Py${PY_VER}_${COMPILER_SUFFIX}.exe"

          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          echo "OUTPUT_NAME=$OUTPUT_NAME" >> $env:GITHUB_ENV
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Compile with Nuitka
        run: |
          $COMPILER_FLAG = if ("${{ matrix.compiler }}" -eq "mingw") { "--mingw64" } else { "" }
          uv run python -m nuitka $COMPILER_FLAG --onefile-no-compression --assume-yes-for-downloads --standalone --onefile --windows-console-mode=disable --plugin-enable=upx --plugin-enable=pyside6 --output-filename=${{ env.OUTPUT_NAME }} --output-dir=output --remove-output --lto=yes --windows-product-name=TAS --windows-product-version=${{ env.VERSION }} --windows-file-version=${{ env.VERSION }} --windows-file-description="Telegram Account Switcher" .\launcher.py
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.compiler }}
          path: output/*.exe
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*.exe
          name: ${{ needs.build.outputs.version }}
          tag_name: v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
