name: Build & Release

on:
  push:
    branches: [ v2 ]
  workflow_dispatch:

env:
  BUILD_ARCH: 'x64'
  OS_ENV: 'Windows_x64'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.generate-output.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ env.BUILD_ARCH }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install Dependencies
        run: |
          uv sync --no-dev

      - name: Install Nuitka
        run: |
          uv pip install 'nuitka[onefile]'

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Hook DLL
        shell: cmd
        run: |
          cd src\hook
          compile.bat

      - name: Update Version
        id: generate-output
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          uv run python build_version.py
          $VERSION = uv run python -c "from src.core.constants import APP_VERSION;print(APP_VERSION)"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Compile with Nuitka
        run: |
          uv run python build.py --mode release --toolchain msvc
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-msvc
          path: output/*.exe
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.exe
          name: ${{ needs.build.outputs.version }}
          tag_name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
